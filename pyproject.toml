[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxy-pool-architect"
version = "0.1.0"
description = "A modern FastAPI-based proxy pool system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "httpx[socks]>=0.27.0",
    "loguru>=0.7.2",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
