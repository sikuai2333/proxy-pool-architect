services:
  api:
    build: .
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      APP_ENV: dev
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_ENABLED: "true"
      VALIDATE_INTERVAL_SECONDS: "60"
      VALIDATE_BATCH_SIZE: "500"
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
